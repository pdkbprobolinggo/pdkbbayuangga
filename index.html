    <script type="text/babel" data-presets="react">
        const { useState, useEffect } = React;
        const { BarChart, Bar, LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer } = window.Recharts;

        // --- KONFIGURASI LINK CSV SPREADSHEET MIRROR ---
        const SPREADSHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSqYJdD6mLpndU8JFPQLdOG73AMcSAfW8gmU3QYvgbbNJEufc_af9JBM-k4DuNIpui6hoB17OGNPDdS/pub?output=csv';

        const teamData = {
          assistantManager: { id: 999, name: "Andri Dwi Ariyanto", role: "Asman PDKB", nip: "8908228P3B", photo: "./images/ANDRI DWI ARIYANTO.jpg" },
          pdkbJaringan: [
            { id: 101, name: "Dwi Mulyono", role: "TL PDKB Jaringan", nip: "8608224P3B", photo: "./images/DWI MULYONO.jpg" },
            { id: 102, name: "Moch Andiki K.", role: "JTC SUTT/SUTET", nip: "9817082TCY", photo: "./images/MOCH ANDIKI KRISGANANDA.jpg" },
            { id: 103, name: "Fahmi Imadul B.", role: "JTC SUTT/SUTET", nip: "9817078TCY", photo: "./images/FAHMI IMADUL BILAD.jpg" },
            { id: 104, name: "M. Ilham Muzakki", role: "JTC SUTT/SUTET", nip: "9717085TCY", photo: "./images/MUCHAMMAD ILHAM MUZAKKI.jpg" },
            { id: 105, name: "Sofyan Hendy S.", role: "JTC SUTT/SUTET", nip: "9716033JY", photo: "./images/SOFYAN HENDY SUMITRO.jpg" },
            { id: 106, name: "Muhammad Qivly", role: "JTC SUTT/SUTET", nip: "97201005ZY", photo: "./images/MUHAMMAD QIVLY.jpg" },
            { id: 107, name: "Alwi Daffa R.", role: "JTC SUTT/SUTET", nip: "9720751ZY", photo: "./images/ALWI DAFFA R.jpg" },
            { id: 108, name: "Alfian Wisnu A.", role: "JTC SUTT/SUTET", nip: "9720750ZY", photo: "./images/ALFIAN WISNU ARIBOWO.jpg" },
            { id: 109, name: "Achmad Faried W.", role: "JTC SUTT/SUTET", nip: "9820761ZY", photo: "./images/ACHMAD FARIED WAHBY.jpg" }
          ],
          pdkbGarduInduk: [
            { id: 201, name: "An'nuur Ridwan P.", role: "TL PDKB GI", nip: "9112022P3Y", photo: "./images/ANNUUR RIDWAN PRIMANTHO.jpg" },
            { id: 202, name: "Ramadani Gamaridho", role: "TC GI/GITET", nip: "9112022P3Y", photo: "./images/RAMADANI GAMARIDHO.jpg" },
            { id: 203, name: "Evrizal Wardhana", role: "JTC GI/GITET", nip: "9515005P3Y", photo: "./images/EVRIZAL WARDHANA.jpg" },
            { id: 204, name: "M. Anwar Shiddiq", role: "JTC GI/GITET", nip: "9817084TCY", photo: "./images/MOHAMMAD ANWAR SHIDDIQ.jpeg" }
          ],
          defaultSemester1: [],
          defaultSemester2: [],
          defaultFTE: [],
          defaultWaktuEfektif: []
        };

        const historyYears = [2026, 2025, 2024, 2023, 2022, 2021, 2020];

        // Helper Fungsi Inisial Nama
        const getInitials = (name) => {
          return name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
        };

        // Helper Konverter Embed Google Drive
        const getEmbedUrl = (url) => {
            if (!url) return null;
            if (url.includes('drive.google.com')) {
                return url.replace(/\/view.*$/, '/preview').replace(/\/edit.*$/, '/preview');
            }
            return url;
        };

        // KOMPONEN POP-UP MODAL PREVIEW
        const PreviewModal = ({ cert, onClose }) => {
            if (!cert) return null;
            const embedUrl = getEmbedUrl(cert.url);
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 p-4 backdrop-blur-sm animate-in fade-in duration-200" onClick={onClose}>
                    <div className="bg-white dark:bg-slate-800 rounded-2xl w-full max-w-4xl h-[85vh] flex flex-col shadow-2xl overflow-hidden border border-slate-700" onClick={e => e.stopPropagation()}>
                        <div className="p-4 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center bg-slate-50 dark:bg-slate-800/50">
                            <div>
                                <h3 className="font-bold text-slate-800 dark:text-slate-100 text-base">{cert.rawTitle}</h3>
                                {cert.expiryDate && (
                                    <p className="text-xs text-slate-500">Masa Berlaku: <span className="font-semibold">{cert.expiryDate}</span></p>
                                )}
                            </div>
                            <div className="flex items-center gap-2">
                                {cert.url && (
                                    <a href={cert.url} target="_blank" rel="noreferrer" className="px-3 py-1.5 text-xs font-semibold bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition shadow-sm">
                                        Buka di Tab Baru ↗
                                    </a>
                                )}
                                <button onClick={onClose} className="p-1.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700 font-bold">
                                    ✕
                                </button>
                            </div>
                        </div>
                        <div className="flex-1 bg-slate-100 dark:bg-slate-900 relative">
                            {embedUrl ? (
                                <iframe src={embedUrl} className="w-full h-full border-0" title="Preview Dokumen" allow="autoplay"></iframe>
                            ) : (
                                <div className="flex flex-col items-center justify-center h-full text-slate-400 p-6 text-center">
                                    <span className="text-4xl mb-3">📄</span>
                                    <p className="font-medium text-sm">Link dokumen tidak valid atau belum diisi.</p>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        function App() {
          const [topMenu, setTopMenu] = useState('Overview');
          const [activeTab, setActiveTab] = useState('pdkbJaringan');
          
          const [sheetData, setSheetData] = useState({
            semester1: teamData.defaultSemester1,
            semester2: teamData.defaultSemester2,
            fteYBY: teamData.defaultFTE,
            waktuEfektif: teamData.defaultWaktuEfektif,
            certificates: {} 
          });
          
          // DEFAULT langsung ke Semester 2
          const [activeSemester, setActiveSemester] = useState('semester2');
          const [currentPage, setCurrentPage] = useState('dashboard');
          const [personilType, setPersonilType] = useState('Jaringan'); 
          const [expandedItems, setExpandedItems] = useState({});
          const [expandedCVs, setExpandedCVs] = useState({}); 
          const [selectedCert, setSelectedCert] = useState(null); // State Modal Preview

          const [isLoading, setIsLoading] = useState(true);
          const [errorMessage, setErrorMessage] = useState("");
          
          const [refreshTrigger, setRefreshTrigger] = useState(0);
          const [isDarkMode, setIsDarkMode] = useState(false);
          const [isMainMenuOpen, setIsMainMenuOpen] = useState(false);

          useEffect(() => {
            if (isDarkMode) {
              document.documentElement.classList.add('dark');
            } else {
              document.documentElement.classList.remove('dark');
            }
          }, [isDarkMode]);

          useEffect(() => {
            setIsLoading(true);
            setErrorMessage("");
            
            const url = `${SPREADSHEET_CSV_URL}&_t=${new Date().getTime()}`;
            
            fetch(url)
              .then(response => response.text())
              .then(text => {
                if (text.trim().startsWith('<!DOCTYPE html>')) {
                  throw new Error("Link CSV tidak valid atau belum di-Publish sebagai CSV.");
                }

                // FIX 1: Mesin Pembaca CSV yang lebih tangguh (Mengatasi error jika ada 'Enter' tersembunyi di dalam sel spreadsheet)
                const rows = [];
                let tempRow = [];
                let current = '';
                let inQuotes = false;
                
                for (let i = 0; i < text.length; i++) {
                    const char = text[i];
                    const nextChar = text[i + 1];
                    
                    if (char === '"') {
                        if (inQuotes && nextChar === '"') {
                            current += '"'; 
                            i++;
                        } else {
                            inQuotes = !inQuotes;
                        }
                    } else if (char === ',' && !inQuotes) {
                        tempRow.push(current.trim());
                        current = '';
                    } else if ((char === '\n' || char === '\r') && !inQuotes) {
                        if (char === '\r' && nextChar === '\n') i++;
                        tempRow.push(current.trim());
                        if (tempRow.length > 1 || tempRow[0] !== '') rows.push(tempRow);
                        tempRow = [];
                        current = '';
                    } else {
                        current += char;
                    }
                }
                if (current !== '' || tempRow.length > 0) {
                    tempRow.push(current.trim());
                    rows.push(tempRow);
                }

                const getVal = (colChar, rowNum) => {
                    const colIdx = colChar.toUpperCase().charCodeAt(0) - 65; 
                    const rowIdx = rowNum - 1; 
                    if (rows[rowIdx] && rows[rowIdx][colIdx] !== undefined) {
                        let rawData = rows[rowIdx][colIdx].replace(/(^"|"$)/g, '').trim();
                        rawData = rawData.replace(/\./g, '').replace(/,/g, '.').replace(/[^0-9.-]+/g, "");
                        return Number(rawData) || 0;
                    }
                    return 0; 
                };

                const getStr = (colChar, rowNum) => {
                    const colIdx = colChar.toUpperCase().charCodeAt(0) - 65; 
                    const rowIdx = rowNum - 1; 
                    if (rows[rowIdx] && rows[rowIdx][colIdx] !== undefined) {
                        return rows[rowIdx][colIdx].replace(/(^"|"$)/g, '').trim();
                    }
                    return "";
                };

                // Filter Cerdas: Blacklist Nama Pekerjaan Kosong
                const blacklistedNames = [
                  "asesmen gi level ii", "pemeliharaan mtu", "pemeliharaan konektor",
                  "pemeliharaan insulator dan junction", "pemeliharaan konduktor", "technical",
                  "pemeliharaan gsw", "non technical", "preventive action transmisi",
                  "asesmen transmisi level 1", "asesmen transmisi level 2", "asesmen transmisi level i (cui)",
                  "asesmen transmisi level ii", "pemeliharaan insulator, junction dan aksesoris",
                  "pencegahan gangguang akibat petir", "pencegahan gangguan akibat petir",  
                  "pemeliharaan tla", "pencegahan gangguan akibat benda asing"
                ];

                const getDetailsList = (nameCol, targetCol, realCol, startRow, endRow) => {
                    let list = [];
                    for (let i = startRow; i <= endRow; i++) {
                        const name = getStr(nameCol, i);
                        const target = getVal(targetCol, i);
                        const real = getVal(realCol, i);
                        
                        const lowerName = name.toLowerCase().trim();
                        const isBlacklisted = blacklistedNames.some(b => lowerName === b || lowerName.includes(b));
                        
                        if (name !== "" && !isBlacklisted) {
                            list.push({ name: name, target, real });
                        }
                    }
                    return list;
                };

                const makeCategory = (id, item, category, details) => {
                    const completed = details.reduce((sum, d) => sum + d.real, 0);
                    const target = details.reduce((sum, d) => sum + d.target, 0);
                    return { id, item, category, completed, target, details };
                };

                // Menarik Data Gabungan untuk FTE
                const getCombinedChartData = (startRow1, endRow1, col1, startRow2, endRow2, col2, labelCol) => {
                    let list = [];
                    const count = endRow1 - startRow1 + 1;
                    for(let i=0; i<count; i++) {
                        const label = getStr(labelCol, startRow1 + i) || getStr(labelCol, startRow2 + i);
                        const valJaringan = getVal(col1, startRow1 + i);
                        const valGI = getVal(col2, startRow2 + i);
                        
                        if (label && label.trim() !== "") {
                            list.push({ name: label, Jaringan: valJaringan, GarduInduk: valGI });
                        }
                    }
                    return list;
                };

                // Menarik Data Sertifikat + Tanggal Kadaluarsa (Kolom K, L, M, N)
                const getCertificatesData = (startRow, endRow) => {
                    let certMap = {};
                    for (let i = startRow; i <= endRow; i++) {
                        const name = getStr('K', i).trim();
                        const certStr = getStr('L', i).trim();
                        const linkStr = getStr('M', i).trim();
                        const expiryStr = getStr('N', i).trim();
                        
                        if (name !== "" && certStr !== "") {
                            // Smart Cleaner v2: Hapus "Sertifikat", "Pelatihan", "Pemeliharaan", dll.
                            let cleanName = certStr
                                .replace(/(sertifikasi|sertifikat)(\s+kompetensi)?|pelatihan|diklat|bimtek|pemeliharaan/gi, '')
                                .replace(/^[-–—\s]+|[-–—\s]+$/g, '')
                                .trim();
                            if (!cleanName) cleanName = certStr; // Fallback jika semua kata terhapus

                            // Analisis Tanggal Kadaluarsa (EWS)
                            let status = 'active';
                            let daysLeft = 999;
                            let formattedDate = expiryStr;
                            
                            if (expiryStr) {
                                let dateObj = new Date(expiryStr);
                                
                                // FIX 2: Coba deteksi berbagai format lokal seperti DD/MM/YYYY atau DD-MM-YYYY jika format standar gagal
                                if (isNaN(dateObj.getTime())) {
                                    let parts = expiryStr.split(/[-/]/);
                                    if (parts.length === 3) {
                                        let year, month, day;
                                        if (parts[2].length === 4) { year = parts[2]; month = parts[1]; day = parts[0]; }
                                        else if (parts[0].length === 4) { year = parts[0]; month = parts[1]; day = parts[2]; }
                                        if(year && month && day) {
                                            dateObj = new Date(`${year}-${month}-${day}T00:00:00`);
                                        }
                                    }
                                }
                                
                                if (!isNaN(dateObj.getTime())) {
                                    const today = new Date();
                                    today.setHours(0,0,0,0);
                                    dateObj.setHours(0,0,0,0);
                                    const diffTime = dateObj - today;
                                    daysLeft = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                                    
                                    if (daysLeft <= 0) {
                                        status = 'expired';
                                    } else if (daysLeft <= 90) {
                                        status = 'warning';
                                    }
                                    
                                    const options = { day: 'numeric', month: 'short', year: 'numeric' };
                                    formattedDate = dateObj.toLocaleDateString('id-ID', options);
                                } else {
                                    // Fallback: Jika tanggal benar-benar tidak bisa dibaca sistem, tampilkan teks aslinya
                                    formattedDate = expiryStr;
                                }
                            }

                            const certObj = {
                                rawTitle: certStr,
                                cleanTitle: cleanName,
                                url: linkStr,
                                expiryDate: formattedDate,
                                status: status,
                                daysLeft: daysLeft
                            };
                            
                            if (!certMap[name]) certMap[name] = [];
                            certMap[name].push(certObj);
                        }
                    }
                    
                    // Auto-Sorting: Kadaluarsa (Merah) -> Warning (Kuning) -> Aktif (Hijau)
                    Object.keys(certMap).forEach(person => {
                        certMap[person].sort((a, b) => {
                            const statusOrder = { 'expired': 1, 'warning': 2, 'active': 3 };
                            if (statusOrder[a.status] !== statusOrder[b.status]) {
                                return statusOrder[a.status] - statusOrder[b.status];
                            }
                            return a.daysLeft - b.daysLeft;
                        });
                    });

                    return certMap;

                  makeCategory('j-2', "CORRECTIVE ACTION", 'Jaringan', getDetailsList('A', 'C', 'D', 61, 70)),
                  makeCategory('j-3', "PROGRAM KEANDALAN", 'Jaringan', getDetailsList('A', 'C', 'D', 73, 88))

                  makeCategory('g-6', "PROGRAM KEANDALAN", 'Gardu Induk', getDetailsList('A', 'F', 'G', 31, 41)),
                  makeCategory('j-4', "PREVENTIVE ACTION", 'Jaringan', getDetailsList('A', 'F', 'G', 50, 59)),
                  makeCategory('j-5', "CORRECTIVE ACTION", 'Jaringan', getDetailsList('A', 'F', 'G', 61, 70)),

                  <div className="flex justify-between items-center mb-6">

                      <h2 className="text-2xl font-extrabold text-slate-800 dark:text-slate-100 flex items-center gap-3">

                      </h2>
                    </div>
                  </div>

                  {}
                  {/* VIP LEADER BANNER - ASMAN PDKB */}
                  <div className="bg-gradient-to-r from-[#0e487a] to-[#1a65a4] text-white rounded-3xl p-6 shadow-lg mb-8 flex flex-col md:flex-row items-center gap-6 relative overflow-hidden border border-blue-400/20">
                    <div className="absolute -right-10 -bottom-10 w-48 h-48 bg-white/5 rounded-full pointer-events-none"></div>
                    <div className="h-24 w-24 md:h-28 md:w-28 rounded-full border-4 border-white/20 shadow-inner overflow-hidden flex-shrink-0 bg-blue-900 flex items-center justify-center text-3xl font-extrabold">

                      <span style={{ display: teamData.assistantManager.photo ? 'none' : 'flex' }}>{getInitials(teamData.assistantManager.name)}</span>

                    <div className="w-full md:w-auto">

                  <div className="bg-white dark:bg-slate-800 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-sm p-6 mb-8">
                    <h2 className="text-lg font-extrabold text-slate-800 dark:text-slate-100 mb-6 uppercase tracking-wider text-center">Grafik FTE Year by Year</h2>
                    <div className="h-80 w-full mb-8">
                      {isLoading ? ( <div className="h-full flex items-center justify-center text-slate-400 text-sm animate-pulse">Menarik data grafik...</div> ) : (
                        <ResponsiveContainer width="100%" height="100%">
                          <LineChart data={sheetData.fteYBY} margin={{ top: 10, right: 10, left: -20, bottom: 0 }}>
                            <CartesianGrid strokeDasharray="3 3" vertical={false} stroke={isDarkMode ? '#334155' : '#e2e8f0'} />
                            <XAxis dataKey="name" tick={{ fontSize: 11, fill: isDarkMode ? '#94a3b8' : '#64748b' }} />
                            <YAxis padding={{ top: 20, bottom: 20 }} tick={{ fontSize: 11, fill: isDarkMode ? '#94a3b8' : '#64748b' }} />
                            <Tooltip content={<CustomTooltip />} />
                            <Legend wrapperStyle={{ fontSize: '12px', paddingTop: '10px' }} />
                            <Line type="monotone" dataKey="Jaringan" stroke="#3b82f6" strokeWidth={3} dot={{ r: 4 }} activeDot={{ r: 6 }} />
                            <Line type="monotone" dataKey="GarduInduk" name="Gardu Induk" stroke="#10b981" strokeWidth={3} dot={{ r: 4 }} activeDot={{ r: 6 }} />
                          </LineChart>
                        </ResponsiveContainer>
                      )}
                    </div>
                    <div className="overflow-x-auto">
                      <table className="w-full text-sm text-left text-slate-600 dark:text-slate-300">
                        <thead className="text-xs text-slate-500 uppercase bg-slate-50 dark:bg-slate-700 dark:text-slate-400">
                          <tr>
                            <th className="px-4 py-3 rounded-l-lg">Tahun / Periode</th>
                            <th className="px-4 py-3 text-right text-blue-600 dark:text-blue-400">FTE Jaringan</th>
                            <th className="px-4 py-3 text-right text-emerald-600 dark:text-emerald-400 rounded-r-lg">FTE Gardu Induk</th>
                          </tr>
                        </thead>
                        <tbody>
                          {(sheetData.fteYBY || []).map((row, idx) => (
                            <tr key={idx} className="border-b border-slate-100 dark:border-slate-700 last:border-0 hover:bg-slate-50 dark:hover:bg-slate-800/50">
                              <td className="px-4 py-2.5 font-medium">{row.name}</td>
                              <td className="px-4 py-2.5 text-right font-bold">{typeof row.Jaringan === 'number' ? row.Jaringan.toLocaleString('id-ID') : row.Jaringan}</td>
                              <td className="px-4 py-2.5 text-right font-bold">{typeof row.GarduInduk === 'number' ? row.GarduInduk.toLocaleString('id-ID') : row.GarduInduk}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>

                  <div className="bg-white dark:bg-slate-800 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-sm p-6">
                    <h2 className="text-lg font-extrabold text-slate-800 dark:text-slate-100 mb-6 uppercase tracking-wider text-center">Waktu Efektif Kerja Pertahun</h2>
                    <div className="h-80 w-full mb-8">
                      {isLoading ? ( <div className="h-full flex items-center justify-center text-slate-400 text-sm animate-pulse">Menarik data grafik...</div> ) : (
                        <ResponsiveContainer width="100%" height="100%">
                          <LineChart data={sheetData.waktuEfektif} margin={{ top: 10, right: 10, left: -20, bottom: 0 }}>
                            <CartesianGrid strokeDasharray="3 3" vertical={false} stroke={isDarkMode ? '#334155' : '#e2e8f0'} />
                            <XAxis dataKey="name" tick={{ fontSize: 11, fill: isDarkMode ? '#94a3b8' : '#64748b' }} />
                            <YAxis padding={{ top: 20, bottom: 20 }} tick={{ fontSize: 11, fill: isDarkMode ? '#94a3b8' : '#64748b' }} />
                            <Tooltip content={<CustomTooltip />} />
                            <Legend wrapperStyle={{ fontSize: '12px', paddingTop: '10px' }} />
                            <Line type="monotone" dataKey="Jaringan" stroke="#3b82f6" strokeWidth={3} dot={{ r: 4 }} activeDot={{ r: 6 }} />
                            <Line type="monotone" dataKey="GarduInduk" name="Gardu Induk" stroke="#10b981" strokeWidth={3} dot={{ r: 4 }} activeDot={{ r: 6 }} />
                          </LineChart>
                        </ResponsiveContainer>
                      )}
                    </div>
                    <div className="overflow-x-auto">
                      <table className="w-full text-sm text-left text-slate-600 dark:text-slate-300">
                        <thead className="text-xs text-slate-500 uppercase bg-slate-50 dark:bg-slate-700 dark:text-slate-400">
                          <tr>
                            <th className="px-4 py-3 rounded-l-lg">Tahun / Periode</th>
                            <th className="px-4 py-3 text-right text-blue-600 dark:text-blue-400">Jam Efektif Jaringan</th>
                            <th className="px-4 py-3 text-right text-emerald-600 dark:text-emerald-400 rounded-r-lg">Jam Efektif Gardu Induk</th>
                          </tr>
                        </thead>
                        <tbody>
                          {(sheetData.waktuEfektif || []).map((row, idx) => (
                            <tr key={idx} className="border-b border-slate-100 dark:border-slate-700 last:border-0 hover:bg-slate-50 dark:hover:bg-slate-800/50">
                              <td className="px-4 py-2.5 font-medium">{row.name}</td>
                              <td className="px-4 py-2.5 text-right font-bold">{typeof row.Jaringan === 'number' ? row.Jaringan.toLocaleString('id-ID') : row.Jaringan}</td>
                              <td className="px-4 py-2.5 text-right font-bold">{typeof row.GarduInduk === 'number' ? row.GarduInduk.toLocaleString('id-ID') : row.GarduInduk}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </main>

              ) : (
                
                <main className="max-w-7xl mx-auto p-4 md:p-6 lg:p-8 animate-in fade-in duration-300">
                  {errorMessage && (
                    <div className="mb-6 bg-amber-50 border-l-4 border-amber-500 p-4 rounded-md text-amber-800 text-xs font-medium shadow-sm">💡 {errorMessage}</div>
                  )}

                  <section className="mb-8">
                    <div className="bg-white dark:bg-slate-800 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-sm p-6 transition-colors duration-300">
                      <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4 border-b border-slate-100 dark:border-slate-700/50 pb-4">
                        <h2 className="text-sm font-extrabold text-slate-500 dark:text-slate-400 tracking-wider uppercase flex items-center gap-2">
                          <svg xmlns="http://www.w3.org/2000/svg" width={18} height={18} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-blue-500"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
                          Grafik Performa Target vs Realisasi
                        </h2>
                        
                        <div className="bg-slate-100 dark:bg-slate-900 p-1.5 rounded-lg inline-flex shadow-inner">
                          <button onClick={() => setActiveSemester('semester1')} className={`px-4 py-1.5 rounded-md text-[11px] font-bold transition-all duration-300 ${activeSemester === 'semester1' ? 'bg-white dark:bg-slate-700 text-blue-600 shadow-sm transform scale-105' : 'text-slate-500 hover:text-slate-800'}`}>SEMESTER 1</button>
                          <button onClick={() => setActiveSemester('semester2')} className={`px-4 py-1.5 rounded-md text-[11px] font-bold transition-all duration-300 ${activeSemester === 'semester2' ? 'bg-white dark:bg-slate-700 text-blue-600 shadow-sm transform scale-105' : 'text-slate-500 hover:text-slate-800'}`}>SEMESTER 2</button>
                        </div>
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div className="w-full">
                          <h3 className="text-xs font-bold text-blue-600 dark:text-blue-400 tracking-widest mb-6 text-center">KETERCAPAIAN JARINGAN</h3>
                          <div className="h-64 w-full">
                            {isLoading ? ( <div className="h-full flex items-center justify-center text-slate-400 text-sm animate-pulse">Menarik data...</div> ) : (
                              <ResponsiveContainer width="100%" height="100%">
                                <BarChart data={chartDataJaringan} margin={{ top: 10, right: 10, left: -20, bottom: 0 }}>
                                  <CartesianGrid strokeDasharray="3 3" vertical={false} stroke={isDarkMode ? '#334155' : '#e2e8f0'} />
                                  <XAxis dataKey="name" axisLine={false} tickLine={false} tick={{ fontSize: 10, fill: isDarkMode ? '#94a3b8' : '#64748b' }} />
                                  <YAxis axisLine={false} tickLine={false} tick={{ fontSize: 10, fill: isDarkMode ? '#94a3b8' : '#64748b' }} />
                                  <Tooltip content={<CustomTooltip />} cursor={{ fill: isDarkMode ? '#1e293b' : '#f1f5f9' }} />
                                  <Legend wrapperStyle={{ fontSize: '11px', paddingTop: '10px' }} />
                                  <Bar dataKey="Target" fill={isDarkMode ? '#3b82f6' : '#93c5fd'} radius={[4, 4, 0, 0]} barSize={25} />
                                  <Bar dataKey="Realisasi" fill={isDarkMode ? '#60a5fa' : '#2563eb'} radius={[4, 4, 0, 0]} barSize={25} />
                                </BarChart>
                              </ResponsiveContainer>
                            )}
                          </div>
                        </div>

                        <div className="w-full relative">
                          <div className="hidden md:block absolute -left-4 top-4 bottom-4 w-px bg-slate-200 dark:bg-slate-700/80"></div>
                          <h3 className="text-xs font-bold text-emerald-600 dark:text-emerald-400 tracking-widest mb-6 text-center">KETERCAPAIAN GARDU INDUK</h3>
                          <div className="h-64 w-full">
                            {isLoading ? ( <div className="h-full flex items-center justify-center text-slate-400 text-sm animate-pulse">Menarik data...</div> ) : (
                              <ResponsiveContainer width="100%" height="100%">
                                <BarChart data={chartDataGI} margin={{ top: 10, right: 10, left: -20, bottom: 0 }}>
                                  <CartesianGrid strokeDasharray="3 3" vertical={false} stroke={isDarkMode ? '#334155' : '#e2e8f0'} />
                                  <XAxis dataKey="name" axisLine={false} tickLine={false} tick={{ fontSize: 10, fill: isDarkMode ? '#94a3b8' : '#64748b' }} />
                                  <YAxis axisLine={false} tickLine={false} tick={{ fontSize: 10, fill: isDarkMode ? '#94a3b8' : '#64748b' }} />
                                  <Tooltip content={<CustomTooltip />} cursor={{ fill: isDarkMode ? '#1e293b' : '#f1f5f9' }} />
                                  <Legend wrapperStyle={{ fontSize: '11px', paddingTop: '10px' }} />
                                  <Bar dataKey="Target" fill={isDarkMode ? '#10b981' : '#6ee7b7'} radius={[4, 4, 0, 0]} barSize={25} />
                                  <Bar dataKey="Realisasi" fill={isDarkMode ? '#34d399' : '#059669'} radius={[4, 4, 0, 0]} barSize={25} />
                                </BarChart>
                              </ResponsiveContainer>
                            )}
                          </div>
                        </div>
                      </div>
                    </div>
                  </section>

                  {}
                  <section>
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
                      {/* KOLOM 1: PERSONIL TIM */}
                      <div className="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm p-5 flex flex-col transition-colors duration-300">
                        <div className="flex justify-between items-center mb-5">
                          <h2 className="text-xl font-extrabold text-slate-800 dark:text-slate-100 tracking-tight">PERSONIL TIM</h2>
                        </div>
                        
                        <div className="mb-4">
                          <div className="flex justify-between items-center py-2.5 border-b border-dashed border-slate-200 dark:border-slate-700 text-sm">
                            <span className="text-slate-500 dark:text-slate-400">Asman PDKB</span>
                            <span className="font-bold text-slate-800 dark:text-slate-100 text-right">{teamData.assistantManager.name}</span>
                          </div>
                        </div>

                        <div className="flex gap-1 mb-3 bg-slate-100 dark:bg-slate-900/50 p-1 rounded-lg">
                          <button onClick={() => setActiveTab('pdkbJaringan')} className={`flex-1 text-center py-1.5 text-[11px] font-bold rounded-md transition-all ${activeTab === 'pdkbJaringan' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-500'}`}>Jaringan</button>
                          <button onClick={() => setActiveTab('pdkbGarduInduk')} className={`flex-1 text-center py-1.5 text-[11px] font-bold rounded-md transition-all ${activeTab === 'pdkbGarduInduk' ? 'bg-white text-emerald-600 shadow-sm' : 'text-slate-500'}`}>Gardu Induk</button>
                        </div>

                        <div className="flex-1 overflow-y-auto pr-1 max-h-80 space-y-1">
                          {teamData[activeTab].map((member) => (
                            <div key={member.id} className="flex justify-between items-center py-2.5 border-b border-dashed border-slate-200 dark:border-slate-700 last:border-0">
                              <span className="text-slate-600 dark:text-slate-300 text-[13px] font-medium truncate pr-2">{member.name}</span>
                              <span className="font-bold text-slate-800 dark:text-slate-100 text-[12px] whitespace-nowrap text-right">{member.role}</span>
                            </div>
                          ))}
                        </div>
                      </div>

                      {/* KOLOM 2: REALISASI JARINGAN (Accordion) */}
                      <div className="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm p-5 flex flex-col transition-colors duration-300">
                        <div className="flex justify-between items-center mb-5">
                          <h2 className="text-xl font-extrabold text-blue-600 dark:text-blue-400 tracking-tight">DETAIL JARINGAN</h2>
                        </div>
                        <div className="flex-1 space-y-3">
                          {isLoading ? (
                            <div className="text-center py-4 text-sm text-slate-400 animate-pulse">Menarik data...</div>
                          ) : (
                            currentDisplayData.filter(d => d.category === 'Jaringan').map((r) => {
                              const percentage = r.target > 0 ? Math.round((r.completed / r.target) * 100) : 0;
                              const isExpanded = expandedItems[r.id];

                              return (
                                <div key={r.id} className="py-2 border-b border-dashed border-slate-200 dark:border-slate-700 last:border-0">
                                  <div onClick={() => toggleAccordion(r.id)} className="flex justify-between items-center mb-1.5 cursor-pointer group">
                                    <span className="text-slate-700 dark:text-slate-300 text-[13px] font-bold tracking-wide group-hover:text-blue-600 transition-colors">{r.item}</span>
                                    <div className="flex items-center gap-2">
                                      <span className="font-extrabold text-[13px] text-blue-600">{r.completed}/{r.target} <span className="ml-1 text-[10px] bg-blue-50 px-1.5 py-0.5 rounded">{percentage}%</span></span>
                                      {isExpanded ? <ChevronUp size={16} className="text-slate-400" /> : <ChevronDown size={16} className="text-slate-400" />}
                                    </div>
                                  </div>
                                  <div className="w-full bg-slate-100 dark:bg-slate-700 h-1.5 rounded-full overflow-hidden">
                                    <div className="bg-blue-500 h-full transition-all duration-500" style={{ width: `${Math.min(percentage, 100)}%` }}></div>
                                  </div>
                                  {isExpanded && (
                                    <div className="mt-3 bg-slate-50 dark:bg-slate-800/80 rounded-xl p-3.5 space-y-2 border border-slate-100 dark:border-slate-700 animate-in fade-in slide-in-from-top-2 duration-300">
                                      {r.details && r.details.length > 0 ? (
                                        r.details.map((detail, idx) => (
                                          <div key={idx} className="flex justify-between items-center text-[12px] border-b border-slate-200 dark:border-slate-700/50 last:border-0 pb-1.5 last:pb-0">
                                            <span className="text-slate-600 dark:text-slate-400">{detail.name}</span>
                                            <span className={`font-bold ${detail.real >= detail.target ? 'text-green-600' : 'text-amber-500'}`}>{detail.real} / {detail.target}</span>
                                          </div>
                                        ))
                                      ) : ( <div className="text-xs text-slate-400 text-center italic py-2">Tidak ada rincian.</div> )}
                                    </div>
                                  )}
                                </div>
                              );
                            })
                          )}
                        </div>
                      </div>

                      {/* KOLOM 3: REALISASI GARDU INDUK (Accordion) */}
                      <div className="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm p-5 flex flex-col transition-colors duration-300">
                        <div className="flex justify-between items-center mb-5">
                          <h2 className="text-xl font-extrabold text-emerald-600 dark:text-emerald-400 tracking-tight">DETAIL GARDU INDUK</h2>
                        </div>
                        <div className="flex-1 space-y-3">
                          {isLoading ? (
                            <div className="text-center py-4 text-sm text-slate-400 animate-pulse">Menarik data...</div>
                          ) : (
                            currentDisplayData.filter(d => d.category === 'Gardu Induk').map((r) => {
                              const percentage = r.target > 0 ? Math.round((r.completed / r.target) * 100) : 0;
                              const isExpanded = expandedItems[r.id];

                              return (
                                <div key={r.id} className="py-2 border-b border-dashed border-slate-200 dark:border-slate-700 last:border-0">
                                  <div onClick={() => toggleAccordion(r.id)} className="flex justify-between items-center mb-1.5 cursor-pointer group">
                                    <span className="text-slate-700 dark:text-slate-300 text-[13px] font-bold tracking-wide group-hover:text-emerald-600 transition-colors">{r.item}</span>
                                    <div className="flex items-center gap-2">
                                      <span className="font-extrabold text-[13px] text-emerald-600">{r.completed}/{r.target} <span className="ml-1 text-[10px] bg-emerald-50 px-1.5 py-0.5 rounded">{percentage}%</span></span>
                                      {isExpanded ? <ChevronUp size={16} className="text-slate-400" /> : <ChevronDown size={16} className="text-slate-400" />}
                                    </div>
                                  </div>
                                  <div className="w-full bg-slate-100 dark:bg-slate-700 h-1.5 rounded-full overflow-hidden">
                                    <div className="bg-emerald-500 h-full transition-all duration-500" style={{ width: `${Math.min(percentage, 100)}%` }}></div>
                                  </div>
                                  {isExpanded && (
                                    <div className="mt-3 bg-slate-50 dark:bg-slate-800/80 rounded-xl p-3.5 space-y-2 border border-slate-100 dark:border-slate-700 animate-in fade-in slide-in-from-top-2 duration-300">
                                      {r.details && r.details.length > 0 ? (
                                        r.details.map((detail, idx) => (
                                          <div key={idx} className="flex justify-between items-center text-[12px] border-b border-slate-200 dark:border-slate-700/50 last:border-0 pb-1.5 last:pb-0">
                                            <span className="text-slate-600 dark:text-slate-400">{detail.name}</span>
                                            <span className={`font-bold ${detail.real >= detail.target ? 'text-green-600' : 'text-amber-500'}`}>{detail.real} / {detail.target}</span>
                                          </div>
                                        ))
                                      ) : ( <div className="text-xs text-slate-400 text-center italic py-2">Tidak ada rincian.</div> )}
                                    </div>
                                  )}
                                </div>
                              );
                            })
                          )}
                        </div>
                      </div>

                    </div>
                  </section>
                </main>
              )}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <style>
      .hide-scrollbar::-webkit-scrollbar { display: none; }
      .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</body>
</html>
